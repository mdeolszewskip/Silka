<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dziennik siłowni</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#E9ECEF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12161C" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Siłownia">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9ECEF; --surface:#FFFFFF; --ink:#1C2430; --muted:#5E6B7A; --line:#D3D9E0;
  --blue:#1F5FBF; --blue-ink:#FFFFFF; --red:#C8372A; --yellow:#F2C230; --field:#F3F5F7;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161C; --surface:#1B212A; --ink:#E7EBF0; --muted:#94A1B1; --line:#2C3542;
    --blue:#4C8BEA; --blue-ink:#0B1422; --red:#E0604F; --yellow:#F2C230; --field:#232B36;
  }
}
:root[data-theme="dark"]{
  --bg:#12161C; --surface:#1B212A; --ink:#E7EBF0; --muted:#94A1B1; --line:#2C3542;
  --blue:#4C8BEA; --blue-ink:#0B1422; --red:#E0604F; --yellow:#F2C230; --field:#232B36;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 120px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0 10px;display:flex;align-items:center;gap:10px}
header.top h1{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.2px;margin:0;flex:1;line-height:1.05}
.status{font-size:13px;color:var(--muted)}
.backup{display:flex;gap:10px;justify-content:center;margin-top:28px}
.backup .btn{font-size:15px;padding:10px 14px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--field)}
.btn.primary{background:var(--blue);color:var(--blue-ink)}
.btn.ghost{background:transparent;color:var(--muted);padding:10px}
.btn.danger{background:transparent;color:var(--red)}
.btn.danger.armed{background:var(--red);color:#fff}
.btn.big{width:100%;font-family:var(--display);font-size:26px;padding:18px;border-radius:16px;letter-spacing:.3px}
.back{background:transparent;border:0;font-size:26px;line-height:1;padding:6px 10px 6px 0;color:var(--ink)}
.empty{color:var(--muted);text-align:center;padding:40px 12px}
.list{margin-top:20px;display:grid;gap:10px}
.wk{display:flex;align-items:stretch;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.wk .date{font-family:var(--display);font-weight:700;font-size:22px;line-height:1;min-width:54px;text-align:center;border-right:1px solid var(--line);padding-right:14px}
.wk .date small{display:block;font-family:var(--body);font-weight:500;font-size:13px;color:var(--muted);margin-top:4px}
.wk .info{flex:1;min-width:0}
.wk .names{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk .meta{font-size:14px;color:var(--muted)}
.month{font-family:var(--display);font-size:18px;color:var(--muted);margin:18px 2px 0}
.daterow{display:flex;align-items:center;gap:10px;margin:4px 0 14px;color:var(--muted);font-size:15px}
.daterow input{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 14px 10px;margin-bottom:14px}
.ex-head{display:flex;align-items:baseline;gap:8px}
.ex-head h2{font-family:var(--display);font-weight:700;font-size:24px;margin:0;flex:1;line-height:1.1}
.prev{font-size:14px;color:var(--muted);margin:4px 0 10px}
.set{display:grid;grid-template-columns:28px 1fr 1fr 34px;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.set .n{font-family:var(--display);font-size:20px;color:var(--muted);text-align:center}
.field{display:flex;align-items:center;background:var(--field);border-radius:12px;overflow:hidden}
.field button{border:0;background:transparent;width:38px;height:48px;font-size:22px;color:var(--muted);flex:none}
.field input{width:100%;min-width:0;border:0;background:transparent;text-align:center;font-family:var(--display);font-weight:700;font-size:28px;padding:0;-moz-appearance:textfield}
.field input::-webkit-outer-spin-button,.field input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.unit{font-size:12px;color:var(--muted);text-align:center;margin-top:2px}
.x{border:0;background:transparent;color:var(--muted);font-size:20px;height:40px}
.pr{display:inline-block;background:var(--yellow);color:#1C2430;font-size:12px;font-weight:600;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.addset{width:100%;margin-top:8px}
.addex{display:flex;gap:8px;margin-top:4px}
.addex input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center}
.bar .vol{flex:1;font-size:14px;color:var(--muted)}
.bar .vol b{display:block;font-family:var(--display);font-size:24px;color:var(--ink);line-height:1}
.summary{display:flex;gap:18px;margin:6px 2px 18px}
.summary div{font-size:13px;color:var(--muted)}
.summary b{display:block;font-family:var(--display);font-size:30px;color:var(--ink);line-height:1}
@media (prefers-reduced-motion: no-preference){.ex.new{animation:pop .25s ease-out}@keyframes pop{from{transform:scale(.97);opacity:.4}}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
(function(){
const DEFAULT_EX=["Wyciskanie sztangi leżąc","Przysiad ze sztangą","Martwy ciąg","Wyciskanie żołnierskie","Podciąganie na drążku","Wiosłowanie sztangą","Wyciskanie hantli na skosie","Pompki na poręczach","Uginanie ramion ze sztangą","Wykroki z hantlami","Prostowanie ramion na wyciągu","Ściąganie drążka wyciągu"];
const LS_KEY="dziennik-silowni-v1";
let workouts=[]; let view={name:"list"}; let store=null; let statusText="";
const saveTimers={};

// ---------- storage ----------
const local={
  load(){try{return JSON.parse(localStorage.getItem(LS_KEY)||"[]")}catch(e){return []}},
  saveAll(){try{localStorage.setItem(LS_KEY,JSON.stringify(workouts))}catch(e){}}
};
async function initDb(){
  if(!window.claude||!window.claude.use) return;
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user) return;
    const uid=await user.id(); if(!uid) return;
    const col=db.collection("data/users/"+uid).doc("profile").collection("workouts");
    const snap=await col.get();
    const remote=snap.docs.map(d=>d.data()).filter(Boolean);
    // migrate anything saved only in this browser
    const ids=new Set(remote.map(w=>w.id));
    const onlyLocal=workouts.filter(w=>!ids.has(w.id));
    store=col; workouts=remote.concat(onlyLocal);
    for(const w of onlyLocal){ await col.doc(w.id).set(w).catch(()=>{}); }
    statusText=""; render();
  }catch(e){ store=null; }
}
function persist(w){
  local.saveAll();
  if(!store) return;
  clearTimeout(saveTimers[w.id]);
  saveTimers[w.id]=setTimeout(()=>{
    store.doc(w.id).set(JSON.parse(JSON.stringify(w))).then(()=>setStatus("Zapisano")).catch(()=>setStatus("Nie udało się zapisać w chmurze — dane są w tej przeglądarce"));
  },700);
}
function removeRemote(id){ local.saveAll(); if(store) store.doc(id).delete().catch(()=>{}); }
function setStatus(t){ statusText=t; const el=document.getElementById("status"); if(el) el.textContent=t; clearTimeout(setStatus.t); setStatus.t=setTimeout(()=>{statusText="";const e=document.getElementById("status");if(e)e.textContent=""},2500); }

// ---------- helpers ----------
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:0};
const fmt=n=>(Math.round(n*100)/100).toLocaleString("pl-PL");
const volume=w=>w.exercises.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+num(s.kg)*num(s.reps),0),0);
const sorted=()=>[...workouts].sort((a,b)=>(b.date+b.created).localeCompare(a.date+a.created));
const MONTHS=["styczeń","luty","marzec","kwiecień","maj","czerwiec","lipiec","sierpień","wrzesień","październik","listopad","grudzień"];
const DAYS=["nd","pn","wt","śr","cz","pt","sb"];
function prevFor(name,w){
  const key=name.trim().toLowerCase();
  for(const o of sorted()){
    if(o.id===w.id||(o.date+o.created)>(w.date+w.created)) continue;
    const e=o.exercises.find(x=>x.name.trim().toLowerCase()===key);
    if(e&&e.sets.length) return {date:o.date,sets:e.sets};
  }
  return null;
}
function bestKg(name,excludeId){
  const key=name.trim().toLowerCase(); let best=0;
  for(const o of workouts){ if(o.id===excludeId) continue;
    for(const e of o.exercises) if(e.name.trim().toLowerCase()===key) for(const s of e.sets) if(num(s.reps)>0) best=Math.max(best,num(s.kg)); }
  return best;
}
function allNames(){
  const set=new Map();
  for(const w of sorted()) for(const e of w.exercises) if(!set.has(e.name.toLowerCase())) set.set(e.name.toLowerCase(),e.name);
  for(const n of DEFAULT_EX) if(!set.has(n.toLowerCase())) set.set(n.toLowerCase(),n);
  return [...set.values()];
}
const current=()=>workouts.find(w=>w.id===view.id);

// ---------- backup ----------
async function exportData(){
  const data=JSON.stringify({app:"dziennik-silowni",version:1,exported:new Date().toISOString(),workouts},null,2);
  const filename="dziennik-silowni-"+today()+".json";
  if(window.claude&&window.claude.use){
    try{ const dl=await claude.use("downloads"); if(dl){ await dl.save({filename,data}); setStatus("Kopia zapisana"); return; } }
    catch(e){ if(e&&(e.code==="declined"||e.code==="rate_limited")) return; }
  }
  const file=new File([data],filename,{type:"application/json"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file],title:"Kopia dziennika siłowni"}); return; }
    catch(e){ if(e&&e.name==="AbortError") return; }
  }
  const a=document.createElement("a"); a.href=URL.createObjectURL(file); a.download=filename;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000);
}
function importFile(f){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const j=JSON.parse(r.result); const list=Array.isArray(j)?j:j.workouts;
      if(!Array.isArray(list)) throw new Error("format");
      const ids=new Set(workouts.map(w=>w.id)); let added=0;
      for(const w of list){
        if(w&&w.id&&w.date&&Array.isArray(w.exercises)&&!ids.has(w.id)){
          if(!w.created) w.created=w.date+"T12:00:00.000Z";
          workouts.push(w); ids.add(w.id); persist(w); added++;
        }
      }
      render(); setStatus(added?"Zaimportowano treningi: "+added:"W pliku nie ma nowych treningów");
    }catch(e){ setStatus("To nie jest plik kopii dziennika"); }
  };
  r.readAsText(f);
}

// ---------- render ----------
const app=document.getElementById("app");
function render(){ view.name==="edit"&&current()?renderEdit():renderList(); }

function renderList(){
  view={name:"list"};
  const ws=sorted();
  const monthAgo=new Date(Date.now()-30*864e5).toISOString().slice(0,10);
  const recent=ws.filter(w=>w.date>=monthAgo);
  let html=`<header class="top"><h1>Dziennik siłowni</h1><span class="status" id="status">${esc(statusText)}</span></header>`;
  if(ws.length) html+=`<div class="summary"><div><b>${ws.length}</b>treningów</div><div><b>${recent.length}</b>w ostatnich 30 dniach</div></div>`;
  html+=`<button class="btn primary big" id="new">Zacznij trening</button>`;
  const backupHtml=`<div class="backup">${ws.length?'<button class="btn" id="exp">Eksportuj kopię</button>':''}<button class="btn" id="imp">Importuj kopię</button><input type="file" id="impf" accept=".json,application/json" hidden></div>`;
  if(!ws.length){ html+=`<p class="empty">Tu pojawią się Twoje treningi. Zacznij pierwszy — dodasz ćwiczenia, ciężar i powtórzenia dla każdej serii.</p>`; }
  else{
    html+=`<div class="list">`; let lastM="";
    for(const w of ws){
      const d=new Date(w.date+"T12:00:00"); const m=MONTHS[d.getMonth()]+" "+d.getFullYear();
      if(m!==lastM){ html+=`<div class="month">${m}</div>`; lastM=m; }
      const names=w.exercises.map(e=>e.name).join(", ")||"Pusty trening";
      const sets=w.exercises.reduce((a,e)=>a+e.sets.length,0);
      html+=`<button class="wk" data-open="${w.id}"><div class="date">${d.getDate()}<small>${DAYS[d.getDay()]}</small></div><div class="info"><div class="names">${esc(names)}</div><div class="meta">${w.exercises.length} ćw., ${sets} serii, ${fmt(volume(w))} kg objętości</div></div></button>`;
    }
    html+=`</div>`;
  }
  html+=backupHtml;
  app.innerHTML=html; window.scrollTo(0,0);
  const ex=document.getElementById("exp"); if(ex) ex.onclick=exportData;
  const impf=document.getElementById("impf");
  document.getElementById("imp").onclick=()=>impf.click();
  impf.onchange=()=>{ if(impf.files[0]) importFile(impf.files[0]); impf.value=""; };
  document.getElementById("new").onclick=()=>{
    const w={id:uid(),date:today(),created:new Date().toISOString(),exercises:[]};
    workouts.push(w); persist(w); view={name:"edit",id:w.id,fresh:true}; render();
  };
  app.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{view={name:"edit",id:b.dataset.open};render();});
}

function renderEdit(focusNew){
  const w=current(); const scroll=window.scrollY;
  let html=`<header class="top"><button class="back" id="back" aria-label="Wróć do listy">‹</button><h1>Trening</h1><span class="status" id="status">${esc(statusText)}</span></header>
  <div class="daterow"><label for="date">Data</label><input type="date" id="date" value="${w.date}"></div>`;
  w.exercises.forEach((e,ei)=>{
    const p=prevFor(e.name,w); const best=bestKg(e.name,w.id);
    html+=`<section class="ex${focusNew&&ei===w.exercises.length-1?" new":""}"><div class="ex-head"><h2>${esc(e.name)}</h2><button class="btn danger" data-delex="${ei}">Usuń</button></div>`;
    html+=`<div class="prev">${p?`Ostatnio: ${p.sets.map(s=>fmt(num(s.kg))+"×"+num(s.reps)).join(", ")}`:"Pierwszy raz to ćwiczenie"}</div>`;
    e.sets.forEach((s,si)=>{
      const isPr=best>0&&num(s.kg)>best&&num(s.reps)>0;
      html+=`<div class="set"><div class="n">${si+1}</div>
      <div><div class="field"><button data-step="${ei},${si},kg,-2.5" aria-label="Mniej o 2,5 kg">−</button><input inputmode="decimal" type="text" value="${fmt(num(s.kg))}" data-in="${ei},${si},kg" aria-label="Ciężar seria ${si+1}"><button data-step="${ei},${si},kg,2.5" aria-label="Więcej o 2,5 kg">+</button></div><div class="unit">kg${isPr?'<span class="pr">rekord</span>':""}</div></div>
      <div><div class="field"><button data-step="${ei},${si},reps,-1" aria-label="Jedno powtórzenie mniej">−</button><input inputmode="numeric" type="text" value="${num(s.reps)}" data-in="${ei},${si},reps" aria-label="Powtórzenia seria ${si+1}"><button data-step="${ei},${si},reps,1" aria-label="Jedno powtórzenie więcej">+</button></div><div class="unit">powt.</div></div>
      <button class="x" data-delset="${ei},${si}" aria-label="Usuń serię ${si+1}">×</button></div>`;
    });
    html+=`<button class="btn addset" data-addset="${ei}">Dodaj serię</button></section>`;
  });
  html+=`<div class="addex"><input id="exname" list="exlist" placeholder="Nazwa ćwiczenia, np. przysiad" autocomplete="off"><button class="btn primary" id="addex">Dodaj</button></div>
  <datalist id="exlist">${allNames().map(n=>`<option value="${esc(n)}">`).join("")}</datalist>
  <div style="margin-top:28px;text-align:center"><button class="btn danger" id="delw">Usuń cały trening</button></div>
  <div class="bar"><div class="in"><div class="vol"><b id="vol">${fmt(volume(w))} kg</b>objętość treningu</div><button class="btn primary" id="done">Zakończ</button></div></div>`;
  app.innerHTML=html;
  if(focusNew) window.scrollTo(0,document.body.scrollHeight); else window.scrollTo(0,scroll);

  const back=()=>{ if(!w.exercises.length){ workouts=workouts.filter(x=>x.id!==w.id); removeRemote(w.id);} view={name:"list"}; render(); };
  document.getElementById("back").onclick=back;
  document.getElementById("done").onclick=back;
  document.getElementById("date").onchange=ev=>{ if(ev.target.value){ w.date=ev.target.value; persist(w);} };
  const addEx=()=>{
    const inp=document.getElementById("exname"); const name=inp.value.trim(); if(!name){inp.focus();return;}
    const p=prevFor(name,w);
    const first=p?{kg:num(p.sets[0].kg),reps:num(p.sets[0].reps)}:{kg:20,reps:10};
    w.exercises.push({name,sets:[first]}); persist(w); renderEdit(true);
  };
  document.getElementById("addex").onclick=addEx;
  document.getElementById("exname").onkeydown=ev=>{ if(ev.key==="Enter") addEx(); };
  // two-tap confirmation (browser confirm() dialogs are blocked inside the artifact viewer)
  const armed=(btn,label,onConfirm)=>{
    btn.onclick=()=>{
      if(btn.dataset.armed){ onConfirm(); return; }
      btn.dataset.armed="1"; const orig=btn.textContent; btn.textContent=label; btn.classList.add("armed");
      setTimeout(()=>{ if(btn.isConnected){ delete btn.dataset.armed; btn.textContent=orig; btn.classList.remove("armed"); } },3000);
    };
  };
  armed(document.getElementById("delw"),"Stuknij ponownie, aby usunąć trening",()=>{ workouts=workouts.filter(x=>x.id!==w.id); removeRemote(w.id); view={name:"list"}; render(); });
  app.querySelectorAll("[data-delex]").forEach(b=>armed(b,"Na pewno?",()=>{ w.exercises.splice(+b.dataset.delex,1); persist(w); renderEdit(); }));
  app.querySelectorAll("[data-addset]").forEach(b=>b.onclick=()=>{ const e=w.exercises[+b.dataset.addset]; const last=e.sets[e.sets.length-1]||{kg:20,reps:10}; e.sets.push({kg:num(last.kg),reps:num(last.reps)}); persist(w); renderEdit(); });
  app.querySelectorAll("[data-delset]").forEach(b=>b.onclick=()=>{ const [ei,si]=b.dataset.delset.split(",").map(Number); w.exercises[ei].sets.splice(si,1); persist(w); renderEdit(); });
  app.querySelectorAll("[data-step]").forEach(b=>b.onclick=()=>{
    const [ei,si,f,d]=b.dataset.step.split(","); const s=w.exercises[+ei].sets[+si];
    s[f]=Math.max(0,Math.round((num(s[f])+parseFloat(d))*100)/100); persist(w); renderEdit();
  });
  app.querySelectorAll("[data-in]").forEach(inp=>{
    inp.onfocus=()=>inp.select();
    inp.oninput=()=>{ const [ei,si,f]=inp.dataset.in.split(","); w.exercises[+ei].sets[+si][f]=Math.max(0,num(inp.value)); persist(w); document.getElementById("vol").textContent=fmt(volume(w))+" kg"; };
    inp.onchange=()=>renderEdit();
  });
}

workouts=local.load();
render();
if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
if(navigator.storage&&navigator.storage.persist){ navigator.storage.persist().catch(()=>{}); }
})();
</script>
</body>
</html>
